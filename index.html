<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePDF Pro Studio — Batch Vault & Encryptor</title>
    
    <!-- DESKTOP & MOBILE HOME SCREEN SHORTCUT ICONS -->
    <meta name="theme-color" content="#0a0d14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SecurePDF Pro">
    <meta name="application-name" content="SecurePDF Pro">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF & ZIP Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0d14; --bg-card: #121824; --bg-sidebar: #0d111a;
            --bg-card-hover: #192233; --accent-primary: #6366f1; --accent-cyan: #06b6d4;
            --accent-green: #10b981; --accent-red: #ef4444; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border-color: #1e293b; --glow-color: rgba(99, 102, 241, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .app-wrapper { display: flex; flex: 1; }

        /* Sidebar */
        .sidebar {
            width: 270px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 1.5rem; position: fixed; height: 100vh; z-index: 50;
            justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 0.75rem; font-weight: 800; font-size: 1.15rem;
            margin-bottom: 2.5rem; background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo i { color: var(--accent-cyan); font-size: 1.5rem; -webkit-text-fill-color: initial; }
        .nav-menu { display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-item {
            display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem;
            border-radius: 8px; color: var(--text-muted); text-decoration: none;
            font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--bg-card-hover); color: var(--text-main); }
        .nav-item.active { border-left: 3px solid var(--accent-cyan); background: rgba(6, 182, 212, 0.1); }
        .nav-item i { width: 20px; text-align: center; }

        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.75rem; color: var(--text-muted); text-align: center; }
        .sidebar-footer strong { color: var(--accent-cyan); }

        /* Main Content */
        .main-content {
            margin-left: 270px; flex: 1; padding: 2.5rem 5%;
            background-image: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.05) 0%, transparent 40%);
            min-height: 100vh; padding-bottom: 5rem;
        }
        .section-view { display: none; animation: fadeIn 0.3s ease; }
        .section-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .page-desc { color: var(--text-muted); font-size: 0.95rem; }

        /* Master Lock Screens */
        .auth-container { max-width: 450px; margin: 4rem auto; text-align: center; background: var(--bg-card); padding: 3rem 2rem; border-radius: 16px; border: 1px solid var(--accent-cyan); box-shadow: 0 10px 40px rgba(6, 182, 212, 0.15); }
        .auth-container i { font-size: 4rem; color: var(--accent-cyan); margin-bottom: 1.5rem; }
        .auth-container h2 { margin-bottom: 0.5rem; }
        .auth-container p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

        /* Vault Table */
        .vault-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(255,255,255,0.03); color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        td { font-size: 0.95rem; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .badge-locked { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-unlocked { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.5rem; border-radius: 6px; transition: 0.2s; }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .action-btn.delete:hover { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .action-btn.unlock-btn:hover { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); }

        .password-reveal { display: flex; align-items: center; gap: 0.5rem; font-family: 'JetBrains Mono', monospace; }

        /* Cards & Form */
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 2rem; max-width: 850px; }
        .dropzone { border: 2px dashed var(--border-color); border-radius: 12px; padding: 3rem 2rem; text-align: center; background: rgba(255,255,255,0.01); cursor: pointer; transition: all 0.3s ease; }
        .dropzone:hover { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.03); }
        .dropzone i { font-size: 3rem; color: var(--accent-cyan); margin-bottom: 1rem; }
        .file-input { display: none; }

        /* Toggle Mode Selector */
        .mode-selector { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .mode-btn { flex: 1; padding: 0.75rem; border: 1px solid var(--border-color); background: var(--bg-dark); color: var(--text-muted); border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; transition: 0.2s; }
        .mode-btn.active { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); color: #fff; }

        /* File List Table */
        .batch-file-list { margin: 1.5rem 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--bg-dark); }
        .file-item-row { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); gap: 1rem; }
        .file-item-row:last-child { border-bottom: none; }
        .file-item-name { font-weight: 600; font-size: 0.9rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        .form-input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); padding: 0.85rem 1rem; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        .form-input:focus { border-color: var(--accent-cyan); }

        .btn { padding: 0.85rem 1.75rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.6rem; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-cyan) 100%); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px var(--glow-color); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .btn-danger:hover { background: var(--accent-red); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--accent-red); color: var(--accent-red); }

        .terminal-log { background: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--accent-green); height: 140px; overflow-y: auto; margin-top: 1rem; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        /* Footer Branding */
        .powered-by-footer { text-align: center; margin-top: auto; padding: 1.5rem 0; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); }
        .powered-by-footer strong { color: var(--accent-cyan); }

        /* Toast Notification */
        #toast { visibility: hidden; min-width: 280px; background-color: var(--bg-card-hover); color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); border: 1px solid var(--accent-cyan); box-shadow: 0 4px 20px rgba(0,0,0,0.6); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 10px; justify-content: center; }
        #toast.show { visibility: visible; animation: toastFadeIn 0.4s, toastFadeOut 0.4s 3.5s forwards; }
        #toast.toast-danger { border-color: var(--accent-red); color: var(--accent-red); }
        #toast.toast-success { border-color: var(--accent-green); color: var(--accent-green); }

        @keyframes toastFadeIn { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes toastFadeOut { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <div id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toast-msg">Notification</span></div>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div>
                <div class="logo"><i class="fa-solid fa-shield-halved"></i> SecurePDF Pro</div>
                <div class="nav-menu">
                    <a class="nav-item active" onclick="switchTab('dashboard')" id="tab-dashboard"><i class="fa-solid fa-vault"></i> Dashboard Vault</a>

                    <a class="nav-item" onclick="switchTab('unprotect')" id="tab-unprotect"><i class="fa-solid fa-unlock"></i> Unprotect PDFs</a>
                </div>
            </div>
            <div class="sidebar-footer">
                Powered by<br><strong>SecurePDF Pro Studio</strong>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- DASHBOARD VAULT VIEW -->
            <div id="view-dashboard" class="section-view active">
                
                <div id="setup-screen" class="auth-container" style="display: none;">
                    <i class="fa-solid fa-key"></i>
                    <h2>Create Master Password</h2>
